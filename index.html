body{font:16px/1.6 Cairo,Tahoma,sans-serif;background:var(--pat),var(--bg);color:var(--ink);min-height:100vh;padding-bottom:84px}
h1,h2{font-family:Amiri,serif}
.hero{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;text-align:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 48px;border-radius:0 0 50% 50%/0 0 34px 34px}
.hero h1{font-size:34px;line-height:1.2}.hero p{opacity:.9;font-size:14px}
.logo{width:92px;height:92px;border-radius:50%;border:3px solid #fff9;object-fit:cover;background:#fff;margin-bottom:6px}
.card{background:var(--c);border:2px solid var(--a);outline:1px solid var(--a);outline-offset:3px;border-radius:12px;padding:14px;margin:18px 16px}
.card h2{color:var(--b);margin-bottom:8px}
input,textarea,select{width:100%;padding:10px;margin:5px 0;border:1.5px solid var(--a);border-radius:10px;font:inherit;background:#fff;color:#000}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:24px;padding:9px 18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;display:inline-block;text-decoration:none}
button:disabled{opacity:.5}
.ln{background:none;color:var(--b);text-decoration:underline;padding:2px 6px;font-size:14px}
.big{width:100%;margin-top:8px;padding:12px}
.it{border-bottom:1px dashed var(--a);padding:8px 0}
.row{display:flex;align-items:center;gap:10px}.row span{flex:1}.row b{color:var(--b);white-space:nowrap}
.row button.ck{width:32px;height:32px;padding:0;border-radius:8px;background:#fff;border:2px solid var(--a);color:var(--a)}
.on button.ck{background:var(--a);color:#fff}.on span{text-decoration:line-through;opacity:.7}
.v{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:12px;padding:12px;margin:16px;text-align:center;font-family:Amiri,serif;font-size:19px}
.pts{display:inline-block;background:#fff3;border-radius:20px;padding:2px 14px;margin-top:6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g img,.sh img{width:100%;border-radius:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:2px solid var(--a);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--ink);border-radius:0;padding:7px 0;font-size:11px;line-height:1.3}
nav button.s{color:var(--a);font-weight:700;border-top:3px solid var(--a)}nav i{display:block;font-style:normal;font-size:20px}
.dots{display:flex;gap:8px;flex-wrap:wrap}.dots button{padding:6px 12px;font-size:13px}
.sup{position:fixed;left:8px;bottom:70px}
video{width:100%;border-radius:10px}
.bn{background:var(--ink);color:#fff;text-align:center;padding:6px;font-size:14px}
details{border-bottom:1px dashed var(--a);padding:6px 0}summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border:1px solid var(--a);padding:4px 6px;text-align:center;white-space:nowrap}th{background:var(--a);color:#fff}td:first-child{text-align:right}#qr img{max-width:100%;image-rendering:pixelated}
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,var(--a),var(--b));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .5s,visibility .5s}
#splash.h{opacity:0;visibility:hidden}
#splash img{width:132px;height:132px;border-radius:50%;border:4px solid #fff9;object-fit:cover;background:#fff;box-shadow:0 8px 30px #0005;animation:spin 1.6s ease-out both}

 o.innerHTML=`<div class="card" style="margin:0 auto;max-width:520px"><h2>${e(c.t)}</h2>${cq(c).map((q,i)=>`<div class="it"><b>${i+1}. ${e(q.q)}</b> <small>(${q.p} درجة)</small>`+(q.ty=='tx'?`<textarea rows="2" id="cx${i}" placeholder="اكتب إجابتك"></textarea>`:q.o.map((t,j)=>`<label style="display:block;padding:4px 0"><input type="radio" name="cq${i}" value="${j}" style="width:auto;margin-left:6px">${e(t)}</label>`).join(''))+`</div>`).join('')}<button class="big" onclick="cSend('${id}')">تسليم الإجابات</button><div style="text-align:center"><button class="ln" onclick="$('#cf').remove()">إلغاء</button></div></div>`;document.body.append(o)}
async function cSend(id){const c=CO(id),a=A();if(!c||!c.open||!a||(a.co||{})[id])return;const ans=[];let sc=0;
 for(let i=0;i<cq(c).length;i++){const q=c.qs[i];
  if(q.ty=='tx'){const v=(($('#cx'+i)||{}).value||'').trim();if(!v)return tt('جاوب على كل الأسئلة (سؤال '+(i+1)+')');ans.push(v)}
  else{const x=document.querySelector('input[name="cq'+i+'"]:checked');if(!x)return tt('جاوب على كل الأسئلة (سؤال '+(i+1)+')');const j=+x.value;ans.push(j);if(j==q.c)sc+=+q.p||0}}
 if(!await md('تسلّم إجاباتك؟ مش هتقدر تعدّلها بعد كده'))return;
 if((a.co||{})[id])return;a.co=a.co||{};a.co[id]={a:ans,s:sc,g:{},d:day(),t:Date.now()};a.pts+=sc;const f=$('#cf');if(f)f.remove();sv();tt('اتسلمت إجاباتك ✓ درجتك '+sc)}
async function cGr(id,uid,i){const c=CO(id),u=U(uid),m=u&&u.co&&u.co[id];if(!c||!m)return;const q=c.qs[i],cur=(m.g||{})[i],v=await md('درجة '+u.name+' على سؤال '+(i+1)+' (من '+q.p+') · إجابته: '+m.a[i],cur??'',1);
 if(v===null||v.trim()==='')return;const n=+v;if(isNaN(n)||n<0||n>q.p)return tt('الدرجة لازم تبقى من 0 لـ '+q.p);m.g=m.g||{};u.pts+=n-(+cur||0);m.g[i]=n;sv()}
async function cRm(id,uid){const c=CO(id),u=U(uid);if(!c||!u||!u.co||!u.co[id])return;if(!await md('تمسح نموذج '+u.name+'؟ هتتخصم درجاته من نقاطه ويقدر يحل تاني'))return;u.pts-=csc(u,c);delete u.co[id];sv()}
function cTog(id){const c=CO(id);if(c){c.open=c.open?0:1;sv()}}
async function cDel(id){if(!await md('تحذف المسابقة؟ النقاط اللي المخدومين خدوها هتفضل زي ما هي'))return;S.n=S.n.filter(x=>ik(x)!=id);sv()}
/* ===== آية اليوم: آية مختلفة لكل مخدوم كل يوم + تنبيه برة التطبيق ===== */
const dn=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const vslot=()=>{const ids=S.u.map(x=>+x.id).sort((a,b)=>a-b),i=ids.indexOf(+S.me);return i<0?ids.length:i};
function dverse(off){if(typeof VERSES=='undefined'||!VERSES.length)return null;const n=VERSES.length;return VERSES[(((vslot()+dn()+(off||0))%n)+n)%n]}
function showVerse(){const v=dverse();if(!v)return tt('الآيات مش متحمّلة، حدّث التطبيق');const old=$('#vo');if(old)old.remove();
 const o=document.createElement('div');o.id='vo';o.style.cssText='position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px';
 o.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0;text-align:center"><img class="logo" src="icon.jpg" alt=""><h2>آية اليوم</h2><div class="v" style="margin:12px 0;font-size:22px;line-height:1.9">${e(v[0])}</div><b style="color:var(--b)">${e(v[1])}</b><button class="big" id="vc">آمين</button></div>`;
 document.body.append(o);o.querySelector('#vc').onclick=()=>o.remove();o.onclick=ev=>{if(ev.target===o)o.remove()}}
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const STAND=!!(navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
const iosHow=()=>`<ol style="padding-inline-start:22px;line-height:1.9;margin:6px 0"><li>افتح اللينك في <b>Safari</b></li><li>دوس على زر المشاركة <b>⬆</b></li><li>اختار <b>إضافة إلى الشاشة الرئيسية</b></li><li>دوس <b>إضافة</b></li><li>افتح التطبيق من <b>أيقونته</b> على الشاشة الرئيسية، وادخل برقم تليفونك تاني</li></ol>`;
function iosBanner(){if(!IOS||STAND||S.ib||$('#ib'))return;const d=document.createElement('div');d.id='ib';d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;max-height:62vh;overflow:auto;background:#fff;color:#000;border:2px solid var(--a);border-radius:14px;padding:12px;box-shadow:0 4px 20px #0006';
 d.innerHTML='<b>ثبّت التطبيق على الآيفون</b><br><small>عشان توصلك التنبيهات ويفتح زي أي تطبيق:</small>'+iosHow()+'<button class="ln" id="ibx">تمام، مش دلوقتي</button>';document.body.append(d);$('#ibx').onclick=()=>{S.ib=1;save();d.remove()}}
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=s=>{const p=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(p),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o};
const vtz=()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Africa/Cairo'}catch(x){return 'Africa/Cairo'}};
async function rpc(fn,b){const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:HD(),body:JSON.stringify(b||{})}),t=await r.text();if(!r.ok)throw new Error(fn+' '+r.status+' '+t.slice(0,80));try{return t?JSON.parse(t):null}catch(x){return t}}
async function vSub(){const key=await rpc('push_public_key');if(!key)throw new Error('nokey');
 const kb=b64u(key),reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
 const same=s=>{try{const k=new Uint8Array(s.options.applicationServerKey);return k.length==kb.length&&k.every((v,i)=>v==kb[i])}catch(x){return true}};
 if(sub&&!same(sub)){await sub.unsubscribe();sub=null}
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:kb});
 const j=sub.toJSON();await rpc('push_save',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_time:(S.pv&&S.pv.t)||'08:00',p_tz:vtz(),p_enabled:true});return sub}
async function vOn(){if(!pushOK())return tt('المتصفح ده مش بيدعم التنبيهات');if(!navigator.onLine)return tt('محتاج نت عشان تفعّل التنبيه');
 try{const p=await Notification.requestPermission();if(p!='granted'){r();return tt('لازم تسمح بالإشعارات للتطبيق من إعدادات الموبايل')}
  await vSub();S.pv={...(S.pv||{}),on:1};save();r();tt('اتفعّل التنبيه ✓')}
 catch(x){tt(x&&x.message=='nokey'?'السيرفر لسه بيتجهز، جرب بعد دقيقة':'مقدرناش نفعّل التنبيه: '+(x&&x.message||x))}}
async function vOff(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){try{await rpc('push_remove',{p_endpoint:sub.endpoint})}catch(x){}await sub.unsubscribe()}}catch(x){}
 S.pv={...(S.pv||{}),on:0};save();r();tt('اتقفل التنبيه')}
async function vTime(t){if(!/^\d\d:\d\d$/.test(t||''))return;S.pv={...(S.pv||{}),t};save();
 if(S.pv.on){try{await vSub();tt('اتغيّر وقت التنبيه ✓')}catch(x){tt('الوقت اتحفظ وهيتحدّث لما النت يرجع')}}}
async function vTest(){try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(!sub)return tt('فعّل التنبيه الأول');
 await vSub();await rpc('push_test',{p_endpoint:sub.endpoint});tt('هيوصلك تنبيه تجريبي خلال دقيقة تقريباً')}catch(x){tt('حصلت مشكلة: '+(x&&x.message||x))}}
const vcard=()=>{if(!S.me&&!S.sup)return '';if(IOS&&!STAND)return `<div class="card"><h2>آية اليوم</h2><button class="ln" onclick="showVerse()">اقرأ آية النهاردة</button><hr><b>عشان توصلك التنبيهات على الآيفون لازم تثبّت التطبيق:</b>${iosHow()}</div>`;const P=S.pv||{},ok=pushOK(),den=ok&&Notification.permission=='denied',on=!!(P.on&&ok&&Notification.permission=='granted');
 return `<div class="card"><h2>آية اليوم</h2><p><small>كل يوم آية مختلفة ليك، وتوصلك في تنبيه برة التطبيق.</small></p><button class="ln" onclick="showVerse()">اقرأ آية النهاردة</button>`+
 (ok?`<hr><label>وقت التنبيه كل يوم</label><input id="vt" type="time" value="${e(P.t||'08:00')}" onchange="vTime(this.value)">${den?'<p><small>الإشعارات مقفولة للتطبيق، فعّلها من إعدادات الموبايل ثم ارجع هنا.</small></p>':''}<button class="big" onclick="${on?'vOff()':'vOn()'}">${on?'إيقاف التنبيه':'تفعيل التنبيه'}</button>${on?'<div style="text-align:center"><button class="ln" onclick="vTest()">ابعتلي تنبيه تجريبي</button></div>':''}`:(IOS?'<p><small>التنبيهات محتاجة iOS 16.4 أو أحدث. حدّث الآيفون وجرّب تاني.</small></p>':'<p><small>المتصفح ده مش بيدعم التنبيهات. افتح التطبيق من كروم على أندرويد.</small></p>'))+`</div>`};
async function vInit(){iosBanner();if(/[?&]verse=1/.test(location.search)){history.replaceState(null,'',location.pathname);setTimeout(showVerse,400)}
 if(/[?&]notice=1/.test(location.search)){history.replaceState(null,'',location.pathname);if(S.me||S.sup){pg='n';r()}}
 if(!pushOK())return;navigator.serviceWorker.addEventListener('message',m=>{if(m.data&&m.data.t=='verse')showVerse();if(m.data&&m.data.t=='notice'&&(S.me||S.sup)){pg='n';r()}});
 const P=S.pv;if(!P||!P.on)return;if(Notification.permission!='granted'){S.pv.on=0;save();return}
 try{if(navigator.onLine)await vSub()}catch(x){}}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(ui,1000);setInterval(sync,20000);addEventListener('online',sync);addEventListener('offline',ui);r();sync();vInit();
